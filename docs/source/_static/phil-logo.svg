<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 760 240"
   role="img"
   aria-label="Phil"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <title>Phil</title>
  <defs>
    <linearGradient id="phil-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="phil-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <g transform="translate(64, 0)">
    <!-- Unfilled matrix cells (bottom-center & bottom-right) -->
    <rect x="96" y="152" width="46" height="46" rx="10" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2" />
    <rect x="152" y="152" width="46" height="46" rx="10" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2" />

    <!-- Observed 'P' cells in the 3x3 tabular matrix -->
    <rect x="40" y="40" width="46" height="46" rx="10" fill="url(#phil-grad)" />
    <rect x="40" y="96" width="46" height="46" rx="10" fill="url(#phil-grad)" />
    <rect x="40" y="152" width="46" height="46" rx="10" fill="url(#phil-grad)" />
    <rect x="96" y="40" width="46" height="46" rx="10" fill="url(#phil-grad)" />
    <rect x="152" y="40" width="46" height="46" rx="10" fill="url(#phil-grad)" />
    <rect x="152" y="96" width="46" height="46" rx="10" fill="url(#phil-grad)" />

    <!-- Center cell (96, 96): Missing slot imputed by ECT descriptor -->
    <rect x="96" y="96" width="46" height="46" rx="10" fill="none" stroke="#10B981" stroke-width="3" stroke-dasharray="6 4" />
    <rect x="103" y="103" width="32" height="32" rx="7" fill="url(#phil-emerald)" />

    <!-- ECT sweeping level-set filtration arc -->
    <path d="M 52,186 A 118,118 0 0 1 186,52" fill="none" stroke="#141414" stroke-width="2.5" stroke-dasharray="4 5" opacity="0.38" />
    <circle cx="119" cy="119" r="6" fill="#FFFFFF" />
  </g>
  <text
     x="336"
     y="148"
     fill="#141414"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
     font-weight="800"
     font-size="116px"
     letter-spacing="-4">Phil</text>
  <text
     x="340"
     y="186"
     fill="#6366F1"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
     font-weight="600"
     font-size="19px"
     letter-spacing="2.5">TOPOLOGICAL IMPUTATION</text>
</svg>
