<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 240 240"
   role="img"
   aria-label="Phil"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <title>Phil</title>
  <defs>
    <linearGradient id="phil-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <linearGradient id="phil-emerald-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>
  <g>
    <!-- Unfilled matrix cells (bottom-center & bottom-right) -->
    <rect x="96" y="152" width="46" height="46" rx="10" fill="#182032" stroke="#2D3A54" stroke-width="2" />
    <rect x="152" y="152" width="46" height="46" rx="10" fill="#182032" stroke="#2D3A54" stroke-width="2" />

    <!-- Observed 'P' cells in the 3x3 tabular matrix -->
    <rect x="40" y="40" width="46" height="46" rx="10" fill="url(#phil-grad-dark)" />
    <rect x="40" y="96" width="46" height="46" rx="10" fill="url(#phil-grad-dark)" />
    <rect x="40" y="152" width="46" height="46" rx="10" fill="url(#phil-grad-dark)" />
    <rect x="96" y="40" width="46" height="46" rx="10" fill="url(#phil-grad-dark)" />
    <rect x="152" y="40" width="46" height="46" rx="10" fill="url(#phil-grad-dark)" />
    <rect x="152" y="96" width="46" height="46" rx="10" fill="url(#phil-grad-dark)" />

    <!-- Center cell (96, 96): Missing slot imputed by ECT descriptor -->
    <rect x="96" y="96" width="46" height="46" rx="10" fill="none" stroke="#34D399" stroke-width="3" stroke-dasharray="6 4" />
    <rect x="103" y="103" width="32" height="32" rx="7" fill="url(#phil-emerald-dark)" />

    <!-- ECT sweeping level-set filtration arc -->
    <path d="M 52,186 A 118,118 0 0 1 186,52" fill="none" stroke="#F4F0E8" stroke-width="2.5" stroke-dasharray="4 5" opacity="0.45" />
    <circle cx="119" cy="119" r="6" fill="#FFFFFF" />
  </g>
</svg>
